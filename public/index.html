<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jolenetris">
  <title>Jolenetris</title>
  <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="brand">
        <div class="logo">J</div>
        <h1>JOLENE<span>TRIS</span></h1>
      </div>
      <div class="top-actions">
        <button id="btn-sound" class="icon-btn" aria-label="Toggle sound">🔇</button>
        <button id="btn-pause" class="icon-btn" aria-label="Pause">⏸</button>
      </div>
    </header>

    <main class="game">
      <aside class="side left">
        <div class="panel">
          <div class="label">HOLD</div>
          <canvas id="hold" width="96" height="96"></canvas>
        </div>
        <div class="panel stats">
          <div class="label">SCORE</div>
          <div id="score" class="value">0</div>
          <div class="label">LINES</div>
          <div id="lines" class="value">0</div>
          <div class="label">LEVEL</div>
          <div id="level" class="value">1</div>
        </div>
      </aside>

      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="flash" class="flash"></div>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <div class="logo big">J</div>
            <h2 id="overlay-title">JOLENETRIS</h2>
            <p id="overlay-msg">Stack 'em. Clear 'em. Breathe.</p>
            <button id="btn-start" class="primary">PLAY</button>
            <p class="hint">← → move · ↑ rotate · ↓ soft drop · Space hard drop · C hold · P pause</p>
          </div>
        </div>
      </div>

      <aside class="side right">
        <div class="panel">
          <div class="label">NEXT</div>
          <canvas id="next" width="96" height="288"></canvas>
        </div>
      </aside>
    </main>

    <nav class="controls" aria-label="Touch controls">
      <button id="btn-hold" class="ctl small">HOLD</button>
      <button id="btn-left" class="ctl">◀</button>
      <button id="btn-down" class="ctl">▼</button>
      <button id="btn-right" class="ctl">▶</button>
      <button id="btn-rotate" class="ctl">⟳</button>
      <button id="btn-drop" class="ctl wide">DROP</button>
    </nav>

  </div>
  <script src="/game.js"></script>
  <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
</body>
</html>
